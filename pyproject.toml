[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "prediction-market-arbitrage"
version = "0.1.0"
description = "Evidence-driven cross-venue prediction market arbitrage research, paper execution, and risk system."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Jameel Shaikh" }]
# `websockets` is the sole runtime dependency: the concrete M2.1
# `WebsocketsTransport` (livebook/ws_transport.py). It is the client the Kalshi
# and Polymarket US docs use; pure Python, no transitive deps. Every other
# module stays dependency-free.
dependencies = [
  "websockets>=13",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.10",
  "pre-commit>=3.7",
  "pytest>=8.2",
  "ruff>=0.5",
]

[tool.hatch.build.targets.wheel]
packages = ["src/prediction_market_arbitrage"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
mypy_path = "src"
